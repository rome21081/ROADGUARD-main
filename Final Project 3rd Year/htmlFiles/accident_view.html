<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>R.O.A.D — Accident Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://unicons.iconscout.com/release/v3.0.6/css/line.css" rel="stylesheet">

  <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet">

  <link rel="stylesheet" href="../cssFiles/style.css">

  <style>
    .accident-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .severity-Severe { background: #ffe0e0; border-left: 6px solid #d32f2f; }
    .severity-Moderate { background: #fff3cd; border-left: 6px solid #f0ad4e; }
    .severity-Minor { background: #e7f7e7; border-left: 6px solid #5cb85c; }
    .severity-Unknown { background: #e0e0e0; border-left: 6px solid #888; }
    .accident-header { font-size: 1.5rem; font-weight: 700; margin-bottom: 15px; }
    .accident-info { margin-bottom: 8px; }
    .vehicle-card, .image-card { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    #map { width: 100%; height: 300px; border-radius: 10px; margin-top: 10px; }
    .image-card img { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>

  <aside class="sidebar position-fixed top-0 left-0 h-100 overflow-auto" id="sidebar">
    <i class="uil-bars close-aside d-md-none" data-close="sidebar"></i>
    <div class="sidebar-header d-flex align-items-center px-3 py-4">
      <img class="rounded-pill img-fluid" width="65" src="" alt="avatar">
      <div class="ms-2">
        <h5 class="fs-6 mb-0"><a href="#" class="text-decoration-none"></a></h5>
        <p class="mt-1 mb-0"></p>
      </div>
    </div>
    <div class="search text-center px-4 py-3 mt-2 position-relative">
      <input type="text" class="form-control w-100 border-0 bg-transparent" placeholder="Search here">
      <i class="fa fa-search position-absolute fs-6"></i>
    </div>
    <ul class="categories list-unstyled mt-3">
      <li class="has-dropdown"><i class="uil-estate"></i><a href="../htmlFiles/main.html"> Dashboard</a></li>
      <li><i class="uil-map-marker"></i><a href="../htmlFiles/map.html"> Map</a></li>
      <li><i class="uil-clipboard-alt"></i><a href="../htmlFiles/report.html"> Report Accident</a></li>
      <li><i class="uil-list-ul"></i><a href="../htmlFiles/accidentlist.html"> Accident and Incident</a></li>
      <li><i class="uil-users-alt"></i><a href="#"> Users</a></li>
      <li><i class="uil-cog"></i><a href="#"> Settings</a></li>
    </ul>
  </aside>

  <section id="wrapper">

    <nav class="navbar navbar-expand-md">
      <div class="container-fluid mx-2">
        <div class="navbar-header d-flex align-items-center">
          <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <i class="uil-bars text-white show-side-btn" data-show="sidebar"></i>
          </button>
          <a class="navbar-brand" href="#">ROAD <span class="main-color">Real-Time Observation & Detection of Accident and Incedent Reports</span></a>
        </div>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Settings</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">My account</a></li>
                <li><a class="dropdown-item" href="#">My inbox</a></li>
                <li><a class="dropdown-item" href="#">Help</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Log out</a></li>
              </ul>
            </li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="uil-comments-alt"></i><span id="nav-msg-count">0</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="uil-bell"></i><span id="nav-notif-count">0</span></a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="p-4">
      <a href="accidentlist.html" class="btn btn-secondary mb-3"><i class="uil-arrow-left"></i> Back to List</a>
      <div id="accidentDetail" class="accident-card text-center">
        <p class="text-muted">Loading accident details...</p>
      </div>
    </div>
  </section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const getAccidentId = () => new URLSearchParams(window.location.search).get('id');

  const formatDate = (dateString) => {
    const d = new Date(dateString);
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    return `${d.toLocaleDateString('en-US', options)} | ${time}`;
  };

  const initMap = (lat, lng, popupText) => {
    const map = L.map('map').setView([parseFloat(lat), parseFloat(lng)], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    L.marker([parseFloat(lat), parseFloat(lng)]).addTo(map).bindPopup(popupText).openPopup();
  };

  const renderAccidentDetails = (accident) => {
    const container = document.getElementById('accidentDetail');
    const severityClass = accident.severity ? `severity-${accident.severity}` : 'severity-Unknown';
    container.className = `accident-card ${severityClass}`;

    const formattedDate = formatDate(accident.accident_date);

    const vehiclesHTML = (accident.vehicles || []).map(v => `
      <div class="vehicle-card">
        <strong>Plate:</strong> ${v.plate_number || '-'}<br>
        <strong>Brand:</strong> ${v.brand || '-'}<br>
        <strong>Model:</strong> ${v.model || '-'}<br>
        <strong>Year:</strong> ${v.year || '-'}<br>
        <strong>Color:</strong> ${v.color || '-'}<br>
        <strong>Type:</strong> ${v.type_name || '-'}<br>
        <strong>Notes:</strong> ${v.notes || '-'}
      </div>
    `).join('');

    const imagesHTML = (accident.images || []).map(img => `
      <div class="image-card"><img src="../${img.file_path}" alt="Accident Image"></div>
    `).join('');

    container.innerHTML = `
      <div class="accident-header">${accident.case_number || 'No Case Number'}</div>
      <div class="accident-info"><strong>Date:</strong> ${formattedDate}</div>
      <div class="accident-info"><strong>Location:</strong> ${accident.address || '-'}</div>
      <div class="accident-info"><strong>Severity:</strong> ${accident.severity || 'Unknown'}</div>
      <div class="accident-info"><strong>Description:</strong> ${accident.description || 'No description'}</div>
      ${vehiclesHTML ? `<h5 class="mt-3">Vehicles Involved</h5>${vehiclesHTML}` : ''}
      ${imagesHTML ? `<h5 class="mt-3">Images</h5>${imagesHTML}` : ''}
      <div id="map"></div>
    `;

    if (accident.latitude && accident.longitude) {
      initMap(accident.latitude, accident.longitude, `${formattedDate} - ${accident.address}`);
    }
  };

  const loadAccident = async () => {
    const accidentId = getAccidentId();
    const container = document.getElementById('accidentDetail');

    if (!accidentId) {
      container.innerHTML = '<p class="text-danger text-center">No accident ID provided.</p>';
      return;
    }

    try {
      const [accRes, incRes] = await Promise.all([
        fetch('accident.json'),
        fetch('incident.json')
      ]);

      const accidentData = await accRes.json();
      const incidentData = await incRes.json();

      const normalizedIncidents = incidentData.map(inc => ({
        accident_id: inc.incident_id,
        case_number: inc.case_number,
        accident_date: inc.incident_date,
        address: inc.address,
        severity: inc.severity,
        description: inc.description,
        images: inc.images || [],
        latitude: inc.latitude || null,
        longitude: inc.longitude || null,
        vehicles: inc.vehicles || []
      }));

      const normalizedAccidents = accidentData.map(acc => ({
        accident_id: acc.accident_id,
        case_number: acc.case_number,
        accident_date: acc.accident_date,
        address: acc.address,
        severity: acc.severity,
        description: acc.description,
        images: acc.images || [],
        latitude: acc.latitude || null,
        longitude: acc.longitude || null,
        vehicles: acc.vehicles || []
      }));

      const allData = [...normalizedAccidents, ...normalizedIncidents];

      const accident = allData.find(a => a.accident_id == accidentId);

      if (!accident) {
        container.innerHTML = '<p class="text-muted text-center">Accident/Incident not found.</p>';
        return;
      }

      renderAccidentDetails(accident);

    } catch (err) {
      console.error("Error loading accident or incident:", err);
      container.innerHTML = "<p class='text-danger'>Failed to load accident/incident data.</p>";
    }
  };

  document.addEventListener('DOMContentLoaded', loadAccident);
</script>
</body>
</html>
