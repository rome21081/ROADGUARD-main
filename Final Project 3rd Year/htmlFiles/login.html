<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Accident Management System</title>
    <link rel="stylesheet" href="../cssFiles/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Welcome Back</h2>
      <p class="login-subtitle">
        Login to access RoadGuard’s real-time safety features
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input
            type="text"
            id="username"
            placeholder="Enter your username or email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Login</button>
        <div class="message" id="loginMessage"></div>
      </form>

      <p class="login-footer">
        Don’t have an account?
        <span id="signupLink" class="btn-register-link">Sign Up</span>
      </p>
    </div>

    <script src="../jsFiles/api.js"></script>
    <script src="../jsFiles/login.js"></script>
  </body>
</html>
